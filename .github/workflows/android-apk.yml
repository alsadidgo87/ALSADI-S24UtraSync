name: Compilar APK ALSADI AlarmSync
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de diagnostico
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validar archivo APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ALSADI-AlarmSync-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
